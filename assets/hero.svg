<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370">
  <defs>
    <radialGradient id="glow1" cx="15%" cy="10%" r="60%"><stop offset="0" stop-color="#14b8a6" stop-opacity=".35"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="85%" cy="60%" r="55%"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset=".55" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset=".5" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2dd4bf" flood-opacity=".35"/></filter>
    <style>
      text{font-family:'Plus Jakarta Sans','Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}
      .float{animation:f 6s ease-in-out infinite}
      .chip1{animation:f 5s ease-in-out infinite}
      .chip2{animation:f 5.5s ease-in-out -2s infinite}
      .chip3{animation:f 6.5s ease-in-out -1s infinite}
      .dot{animation:p 1.6s ease-in-out infinite}
      .r1{animation:t 12s steps(1) infinite}.r2{animation:t 12s steps(1) -8s infinite}.r3{animation:t 12s steps(1) -4s infinite}
      @keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      @keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
      @keyframes t{0%{opacity:1}33.33%{opacity:0}100%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="370" rx="22" fill="#0b1020"/>
  <rect width="1200" height="370" rx="22" fill="url(#glow1)"/>
  <rect width="1200" height="370" rx="22" fill="url(#glow2)"/>

  <!-- status pill -->
  <rect x="60" y="48" width="290" height="36" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
  <circle class="dot" cx="82" cy="66" r="5" fill="#22c55e"/>
  <text x="96" y="71" fill="#cbd5e1" font-size="15">Open to Talent Acquisition &amp; HR roles</text>

  <text x="60" y="160" fill="#f1f5f9" font-size="62" font-weight="800">Hi, I'm <tspan fill="url(#name)">Anurag Singh</tspan></text>

  <g font-size="26" font-weight="600">
    <text class="r1" x="60" y="210" fill="#cbd5e1">I'm a <tspan fill="#f8fafc" font-weight="700">Talent Acquisition Professional</tspan></text>
    <text class="r2" x="60" y="210" fill="#cbd5e1" opacity="0">I'm an <tspan fill="#f8fafc" font-weight="700">HR Operations Specialist</tspan></text>
    <text class="r3" x="60" y="210" fill="#cbd5e1" opacity="0">I'm an <tspan fill="#f8fafc" font-weight="700">HR Tech &amp; Automation Builder</tspan></text>
  </g>

  <g fill="#94a3b8" font-size="18">
    <text x="60" y="260">5 years of end-to-end recruitment and HR operations across</text>
    <text x="60" y="288"><tspan fill="#e2e8f0" font-weight="700">manufacturing and healthcare</tspan>. I hire at scale, onboard smoothly,</text>
    <text x="60" y="316">and build my own HR tools to make HR faster, paperless and data-driven.</text>
  </g>

  <!-- AS tile -->
  <g class="float">
    <g transform="rotate(-6 960 195)" filter="url(#shadow)">
      <rect x="860" y="80" width="210" height="230" rx="30" fill="url(#tile)"/>
      <rect x="872" y="92" width="186" height="206" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="2"/>
      <text x="965" y="228" fill="#fff" font-size="92" font-weight="800" text-anchor="middle">AS</text>
    </g>
  </g>
  <g class="chip1"><rect x="975" y="40" width="190" height="38" rx="12" fill="#111827" stroke="#ffffff" stroke-opacity=".12"/><text x="1070" y="65" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">🎯 Hiring at all levels</text></g>
  <g class="chip2"><rect x="770" y="232" width="170" height="38" rx="12" fill="#111827" stroke="#ffffff" stroke-opacity=".12"/><text x="855" y="257" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">⚡ HR Automation</text></g>
  <g class="chip3"><rect x="980" y="300" width="190" height="38" rx="12" fill="#111827" stroke="#ffffff" stroke-opacity=".12"/><text x="1075" y="325" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">🏭 Manufacturing HR</text></g>
</svg>
